<!DOCTYPE html>

    <h1>Contact</h1>
    <p>Send me a message below, or email me directly at <a href="mailto:contact@connor.day">contact@connor.day</a>.</p>

    <form action="mailto:contact@connor.day">

        <input name="subject">
      </label>
      <label>Body
        <textarea name="body" rows="6"></textarea>
      </label>
      <button>Submit</button>
    </form>
  </main>
