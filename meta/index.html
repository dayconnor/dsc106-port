<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connor Day: Meta</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <h1>Meta</h1>
    <p>Stats about the code behind this site, computed from its git history (<code>loc.csv</code>, generated by elocuent).</p>

    <!-- Lab 6 Step 1.3: summary stats, filled by main.js.
         Lab 8 Step 1.2: they follow the scroll position -->
    <h2>Summary</h2>
    <div id="stats"></div>

    <!-- Lab 8 Step 3.1: story on the left, sticky plot on the right -->
    <h2>Commits by time of day</h2>
    <div id="scrolly-1">
      <!-- Step 3.2: one .step per commit, filled by main.js -->
      <div id="scatter-story"></div>

      <div id="scatter-plot">
        <!-- Lab 8 Step 4: the scroll position replaced the Step 1.1 slider;
             this just says which moment is shown -->
        <p class="as-of">Codebase as of <time id="commit-time"></time></p>

        <!-- Lab 6 Step 2: commits plotted by date and time of day -->
        <div id="chart"></div>

        <!-- Lab 6 Step 5.5–5.6: what the brush has selected -->
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>

    <!-- Lab 8 Step 2: one dot per line of code, grouped by file.
         Step 4: scrollytelling again, with the plot on the left this time -->
    <h2>Lines of code by file</h2>
    <div id="scrolly-2">
      <div id="files-plot">
        <p class="as-of">Codebase as of <time id="files-time"></time></p>
        <dl id="files"></dl>
      </div>

      <!-- one .step per commit, filled by main.js -->
      <div id="files-story"></div>
    </div>

    <!-- Lab 6 Step 3: tooltip, shown while hovering a dot -->
    <dl id="commit-tooltip" class="info tooltip" hidden>
      <dt>Commit</dt>
      <dd>
        <a href="" id="commit-link" target="_blank"></a>
      </dd>

      <dt>Date</dt>
      <dd id="commit-date"></dd>

      <dt>Time</dt>
      <dd id="commit-clock"></dd>

      <dt>Author</dt>
      <dd id="commit-author"></dd>

      <dt>Lines</dt>
      <dd id="commit-lines"></dd>
    </dl>
  </main>

  <footer>
    <a href="https://github.com/dayconnor" target="_blank" rel="noopener noreferrer">GitHub</a>
    <a href="https://linkedin.com/in/con-day" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </footer>
</body>
</html>
